[project]
name = "agentic-annotator"
version = "0.1.0"
description = "Multi-agent data annotation pipeline for Banking77 intent classification"
requires-python = ">=3.11"
dependencies = [
    "langchain-groq",
    "langchain-community",
    "langgraph",
    "fastmcp",
    "langfuse",
    "redis",
    "sentence-transformers",
    "fastapi",
    "uvicorn",
    "datasets",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "tenacity",
    "python-dotenv",
    "cerebras-cloud-sdk",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
